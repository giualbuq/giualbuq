name: Generate snake animation

on:
  # roda automaticamente uma vez por dia
  schedule:
    - cron: "0 0 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda sempre que você fizer push na branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7E22CE&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8
            dist/snake-dark.svg?color_snake=#C084FC&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#c084fc

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
